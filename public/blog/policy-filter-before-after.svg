<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Before and after the fix: the dataset went from 406 items at 87% news to 1,727 items at 21% news, via three levers — parallel fetch, spectacle filter, and a 40% news cap.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .lbl{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;fill:#2a2a26}
      .big{font-family:Georgia,'Newsreader',serif;font-weight:700;fill:#1a1a18}
      .cap{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;fill:#6a6a66}
    </style>
  </defs>

  <!-- sketchy shapes get the roughen filter; text stays crisp -->
  <g filter="url(#rough)">
    <!-- BEFORE bar -->
    <rect x="150" y="70"  width="609" height="46" fill="#e8776a"/>
    <rect x="759" y="70"  width="91"  height="46" fill="#3f9d6b"/>
    <!-- AFTER bar -->
    <rect x="150" y="176" width="147" height="46" fill="#e8776a"/>
    <rect x="297" y="176" width="553" height="46" fill="#3f9d6b"/>
    <!-- legend swatches -->
    <rect x="150" y="270" width="18" height="18" fill="#e8776a"/>
    <rect x="300" y="270" width="18" height="18" fill="#3f9d6b"/>
    <!-- baseline under the levers -->
    <line x1="150" y1="322" x2="850" y2="322" stroke="#cfcabb" stroke-width="2"/>
  </g>

  <text class="lbl" x="150" y="58" font-size="17" font-weight="700">BEFORE</text>
  <text class="cap" x="850" y="58" font-size="15" text-anchor="end">406 items · 87% news</text>
  <text class="lbl" x="150" y="164" font-size="17" font-weight="700">AFTER</text>
  <text class="cap" x="850" y="164" font-size="15" text-anchor="end">1,727 items · 21% news</text>

  <text class="cap" x="176" y="284" font-size="14">news</text>
  <text class="cap" x="326" y="284" font-size="14">policy &amp; research</text>

  <text class="lbl" x="150" y="348" font-size="14.5">
    <tspan font-weight="700">① parallel fetch</tspan> reaches every source ·
    <tspan font-weight="700">② spectacle filter</tspan> drops crime/celebrity/sport ·
    <tspan font-weight="700">③ 40% cap</tspan> on news
  </text>
</svg>
