name: Content freshness

on:
  schedule:
    # Mondays 05:10 UTC, after the weekly source-health probe
    - cron: '10 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Report stale data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/check_freshness.py --markdown > report.md
          cat report.md
          TITLE="Content freshness report"
          NUMBER=$(gh issue list --state open --label freshness --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if grep -q "| STALE |" report.md; then
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --body-file report.md
            else
              gh label create freshness --description "Data that has passed its refresh limit" --color FBCA04 2>/dev/null || true
              gh issue create --title "$TITLE" --label freshness --body-file report.md
            fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Everything is within its limit as of $(date -u +%F)."
          fi

  evidence-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - run: pip install -r scripts/requirements.txt

      - name: Check evidence source links
        run: python3 scripts/check_evidence_links.py
