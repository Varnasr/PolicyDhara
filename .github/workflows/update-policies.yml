name: Update Policy Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets live at job level so step-level `if: env.X != ''` conditions
    # can see them — a step's own env block is not in scope for its `if`,
    # which is why the newsletter/Telegram steps silently never ran.
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install -e ".[dev]"

      - name: Snapshot policy IDs (pre-fetch)
        run: python3 scripts/send_newsletter.py --snapshot-only

      - name: Fetch policy data from all sources
        run: python3 scripts/fetch_all.py
        env:
          PYTHONUNBUFFERED: '1'

      # After the fetch, so the dataset-invariant tests validate the data
      # that is about to be auto-merged — not the previous commit's.
      - name: Run tests (gate auto-merge on green)
        run: pytest tests/ -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Send newsletter if new policies found
        if: env.BUTTONDOWN_API_KEY != ''
        continue-on-error: true
        run: python3 scripts/send_newsletter.py --draft

      - name: Send sector-specific alerts
        if: env.BUTTONDOWN_API_KEY != ''
        continue-on-error: true
        run: python3 scripts/send_newsletter.py --sector-alerts --draft

      - name: Push Telegram alerts for high-priority new policies
        if: env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        run: python3 scripts/push_telegram.py

      - name: Create PR with updated data
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Chore: auto-update policy data"
          branch: auto-update/policy-data
          title: "Chore: auto-update policy data"
          body: "Automated policy data refresh from scheduled workflow."
          delete-branch: true

      - name: Auto-merge PR
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: fetch-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
