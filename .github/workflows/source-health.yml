name: Source Health Check

on:
  schedule:
    # Weekly, Mondays 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe every source
        run: python3 scripts/check_source_health.py --open-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Open PR with updated health data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain data/source_health.json)" ]]; then
            echo "No changes to source_health.json"
            exit 0
          fi
          # master is a protected branch — a direct push is rejected, so the
          # weekly probe lands its results through a PR on a rolling branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/source-health-update"
          git checkout -B "$BRANCH"
          git add data/source_health.json
          git commit -m "Chore: update source_health.json"
          git push -f origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base master --head "$BRANCH" \
              --title "Chore: weekly source-health update" \
              --body "Automated source-health probe results from the weekly run. Review the bucket changes and merge to update the live health board."
          fi
